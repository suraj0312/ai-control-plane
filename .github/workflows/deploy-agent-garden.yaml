name: Deploy agent-garden

# Applies this repo's agent-garden manifests (namespace, RBAC, server and
# client deployments) to the EKS cluster and verifies the rollout.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Install agent-sandbox"]
    types: [completed]
    branches: [prototype]
  # push:
  #   branches: [prototype]
  #   paths:
  #     - "agent-garden/**"
  #     - ".github/workflows/deploy-agent-garden.yml"

permissions:
  contents: read

env:
  AGENT_GARDEN_NAMESPACE: agent-garden
  KUBECONFIG: ${{ github.workspace }}/kubeconfig

jobs:
  deploy-agent-garden:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
    steps:
      # =================================================================
      # STAGE 1: Checkout & Cluster Access
      # =================================================================
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create local KinD cluster
        run: |
          kind create cluster --wait 5m --kubeconfig "$KUBECONFIG"
          # Wait for API server to be ready
          kubectl cluster-info
          kubectl wait --for=condition=Ready node --all --timeout=300s || true

      # =================================================================
      # STAGE 2: Apply Manifests
      # =================================================================
      - name: Apply namespace
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f agent-deployment/agent-garden-ui/namespace.yaml

      - name: Create openai-secret
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic openai-secret \
            --namespace "$AGENT_GARDEN_NAMESPACE" \
            --from-literal=OPENAI_MODEL_NAME="${{ secrets.OPENAI_MODEL_NAME }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -


      - name: Apply RBAC
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f agent-deployment/agent-garden-ui/agent-garden-role-binding.yaml

      - name: Apply server deployment
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f agent-deployment/agent-garden-ui/agent-garden-server-deployment.yaml

      - name: Apply client deployment
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f agent-deployment/agent-garden-ui/agent-garden-client-deployment.yaml

      # =================================================================
      # STAGE 3: Verify Rollout
      # =================================================================
      - name: Wait for rollout
        run: |
          kubectl --kubeconfig "$KUBECONFIG" -n "$AGENT_GARDEN_NAMESPACE" rollout status deployment/agui-server --timeout=180s
          kubectl --kubeconfig "$KUBECONFIG" -n "$AGENT_GARDEN_NAMESPACE" rollout status deployment/agui-client --timeout=180s

      - name: Show provisioned resources
        if: always()
        run: |
          kubectl --kubeconfig "$KUBECONFIG" get all -n "$AGENT_GARDEN_NAMESPACE"
 